# Workflow автоматической публикации статического сайта на GitHub Pages.
# Файл размещается в репозитории по пути: .github/workflows/deploy.yml
name: Deploy static site

# Триггер: workflow запускается при каждом push в ветку main
on:
  push:
    branches: [ main ]

# Права доступа, необходимые для публикации на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
        steps:
      # Шаг 1. Скопировать файлы
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2. Подготовить окружение GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # --- НОВЫЕ ШАГИ ДЛЯ ЛИНТИНГА ---
      # Шаг 3. Установить Node.js (нужен для запуска линтеров)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Шаг 4. Установить и запустить проверку HTML
      - name: Validate HTML
        run: |
          npm install -g html-validate
          html-validate "*.html"

      # Шаг 5. Установить и запустить проверку CSS
      - name: Lint CSS
        run: |
          npm install -g stylelint stylelint-config-standard
          stylelint "*.css"
      # --------------------------------

      # Шаг 6. Упаковать файлы (бывший Шаг 3)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Шаг 7. Опубликовать (бывший Шаг 4)
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
